name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Resources Hub Dependencies
        run: |
          cd resources-hub
          npm ci || npm install

      - name: Build Resources Hub
        run: |
          cd resources-hub
          npm run build

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build Jekyll Site
        run: |
          bundle install || bundle update
          bundle exec jekyll build --destination ./_site

      - name: Ensure Resources Hub in _site
        run: |
          mkdir -p ./_site/resources
          cp -r ./resources/* ./_site/resources/

      - name: Ensure 2D Carbon Explorer in _site
        run: |
          mkdir -p ./_site/2d-carbon-explorer
          cp -r ./2d-carbon-explorer/* ./_site/2d-carbon-explorer/
          mkdir -p ./_site/database-2dgr
          cp -r ./database-2dgr/* ./_site/database-2dgr/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
