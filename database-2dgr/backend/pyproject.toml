[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-explorer-backend"
version = "2.0.0"
description = "Scientific FastAPI backend for 2D Carbon Allotropes Explorer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pymatgen>=2024.1.0",
    "ase>=3.22.0",
    "spglib>=2.3.0",
    "numpy>=1.24.0",
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
pythonpath = [".", ".."]
